# Render blueprint: one web service (API plus in process indexer) and a free Postgres.
services:
  - type: web
    name: remitsure-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: remitsure-db
          property: connectionString
      - key: STELLAR_NETWORK
        value: testnet
      - key: SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: REMITSURE_CONTRACT_ID
        sync: false
      - key: INDEXER_START_LEDGER
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: INDEXER_ENABLED
        value: "true"

databases:
  - name: remitsure-db
    plan: free
